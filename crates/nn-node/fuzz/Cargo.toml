[package]
name = "nn-node-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nn-files = { path = "../../nn-files" }
nn-node = { path = ".." }
nn-store = { path = "../../nn-store" }
serde = "1"
serde_json = "1"

# Fuzzing builds with nightly + sanitizers; keep it out of the main workspace.
[workspace]
members = ["."]

[[bin]]
name = "protocol"
path = "fuzz_targets/protocol.rs"
test = false
doc = false
bench = false

# cargo-deny: licenses, security advisories, and where crates come from.
#   cargo deny check

[graph]
all-features = false

[advisories]
# Unmaintained or yanked crates are reported; vulnerabilities fail.
yanked = "deny"
unmaintained = "workspace"

[licenses]
# Permissive licenses compatible with shipping NetherNode under MIT.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

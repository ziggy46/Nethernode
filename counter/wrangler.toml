# The NetherNode install counter, as a Cloudflare Pages project with
# Functions. See README.md for setup and deployment.
name = "nethernode-installs"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "nethernode-installs"
# From `wrangler d1 create nethernode-installs`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

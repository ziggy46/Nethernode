# The NetherNode install counter. See README.md for setup and deployment.
name = "nethernode-installs"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

# Forget installs that stopped reporting.
[triggers]
crons = ["17 3 * * *"]

# No request logs are kept.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "nethernode-installs"
# From `wrangler d1 create nethernode-installs`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["crates/nn-mcproto/fuzz"]

[workspace.package]
version = "0.2.4"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates
nn-api = { path = "crates/nn-api" }
nn-auth = { path = "crates/nn-auth" }
nn-catalog = { path = "crates/nn-catalog" }
nn-events = { path = "crates/nn-events" }
nn-files = { path = "crates/nn-files" }
nn-link = { path = "crates/nn-link" }
nn-mcproto = { path = "crates/nn-mcproto" }
nn-node = { path = "crates/nn-node" }
nn-orchestrator = { path = "crates/nn-orchestrator" }
nn-players = { path = "crates/nn-players" }
nn-proxy = { path = "crates/nn-proxy" }
nn-store = { path = "crates/nn-store" }
nn-uploads = { path = "crates/nn-uploads" }

# Runtime / HTTP
tokio = { version = "1.53", features = ["full"] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["compression-gzip", "compression-br", "trace", "set-header"] }
http = "1.5"

# RPC
connectrpc = { version = "0.9", features = ["axum"] }
connectrpc-build = "0.9"
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }

# Docker
bollard = "0.21"
futures-util = "0.3"

# Storage
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "macros", "migrate"] }

# Auth / crypto
argon2 = "0.6"
chacha20poly1305 = "0.11"
rand = "0.10"
sha2 = "0.11"
subtle = "2.6"
base64 = "0.23"
hex = "0.4"
regex = "1.11"
hmac = "0.13"
data-encoding = "2.11"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Config / CLI
clap = { version = "4.6", features = ["derive", "env"] }
figment = { version = "0.10", features = ["toml", "env"] }

# Utilities
bytes = "1.12"
uuid = "1.28"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "3"
arc-swap = "1.9"
rust-embed = { version = "8.13", features = ["mime-guess"] }
mime_guess = "2"

# Players
md-5 = "0.11"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
png = "0.18"
flate2 = "1"
tokio-tungstenite = "0.29"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
snow = { version = "0.10", default-features = false, features = ["default-resolver", "default-resolver-crypto"] }
yamux = "0.14"

# Files
cap-std = "4.0.3"
croner = { version = "4", default-features = false, features = ["jiff"] }
tar = "0.4"
zstd = "0.14"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
sha1 = "0.11"
zip = { version = "9.0", default-features = false, features = ["deflate"] }

# OS
rustix = { version = "1.1", default-features = false, features = ["std", "process", "fs"] }

# Errors / observability
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# Testing
tempfile = "3"
proptest = "1.12"
criterion = { version = "0.8", features = ["async_tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Proc macros and build scripts: stripping their dylibs breaks loading them
# on some macOS toolchains. The shipped binary is still stripped.
[profile.release.build-override]
strip = false

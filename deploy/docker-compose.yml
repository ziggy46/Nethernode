# NetherNode with Docker Compose.
#
#   cd deploy && docker compose up -d
#
# Then open http://<this machine>:8080 and create the owner account.
#
# NetherNode starts each Minecraft server as its own container, so it needs
# the Docker socket. Anything with the socket can control Docker, which is
# root on this machine: keep the panel off the open internet (see the
# Cloudflare Tunnel guide) and only give accounts to people you trust.
#
# Settings can be changed in a .env file next to this one:
#   NETHERNODE_DATA=./data            where worlds, backups, and settings live
#   NETHERNODE_BIND=0.0.0.0:8080      the panel's address
#   NETHERNODE_PROXY=0.0.0.0:25565    where players connect
#   NETHERNODE_PORTS_START=30000      host ports for servers (loopback only)
#   NETHERNODE_PORTS_END=30999

services:
  nethernode:
    image: ${NETHERNODE_IMAGE:-nethernode:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # Host networking: the panel and the Smart Proxy listen on this machine's
    # addresses directly, and servers stay on loopback where only NetherNode
    # can reach them. This is the simplest setup; see below for bridge mode.
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Any folder or named volume works: NetherNode finds where it is on
      # the host when it mounts server folders.
      - ${NETHERNODE_DATA:-./data}:/data
    environment:
      NETHERNODE_HTTP__BIND: ${NETHERNODE_BIND:-0.0.0.0:8080}
      NETHERNODE_PROXY__DEFAULT_LISTENER: ${NETHERNODE_PROXY:-0.0.0.0:25565}
      NETHERNODE_DOCKER__PORT_RANGE_START: ${NETHERNODE_PORTS_START:-30000}
      NETHERNODE_DOCKER__PORT_RANGE_END: ${NETHERNODE_PORTS_END:-30999}
      # Behind a reverse proxy or tunnel that sets X-Forwarded-For/-Proto:
      # NETHERNODE_HTTP__TRUST_PROXY_HEADERS: "true"

# Bridge networking instead (for hosts where host networking isn't
# available, such as Docker Desktop): remove `network_mode: host` and add
#
#    ports:
#      - "8080:8080"
#      - "25565:25565"
#    environment:
#      NETHERNODE_DOCKER__BACKEND_IP: "172.17.0.1"
#
# Servers' ports are then published on the Docker bridge gateway (check its
# address with `docker network inspect bridge`), which this container can
# reach and other machines can't. Players' real IP addresses aren't visible
# to NetherNode in bridge mode on Docker Desktop.

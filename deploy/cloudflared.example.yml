# Cloudflare Tunnel for the NetherNode panel only.
#
# A tunnel carries HTTP(S), so it can publish the web panel without opening
# a port on your router. It can't carry Minecraft: players connect over raw
# TCP to the Smart Proxy (port 25565), which needs a port forward or a
# TCP-capable service instead.
#
#   cloudflared tunnel login
#   cloudflared tunnel create nethernode
#   cloudflared tunnel route dns nethernode panel.example.com
#   cloudflared tunnel --config cloudflared.yml run
#
# Put Cloudflare Access in front of the hostname (Zero Trust › Access ›
# Applications) so only people you allow can even reach the sign-in page,
# and tell NetherNode it's behind a proxy:
#   NETHERNODE_HTTP__TRUST_PROXY_HEADERS=true

tunnel: nethernode
credentials-file: /etc/cloudflared/nethernode.json

ingress:
  # The panel, including its WebSocket console and event stream.
  - hostname: panel.example.com
    service: http://127.0.0.1:8080
    originRequest:
      # Large uploads are sent in pieces, but each piece can take a while.
      connectTimeout: 30s
  - service: http_status:404

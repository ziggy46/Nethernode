name: CI

# Fast checks on every push: formatting, lints, types, the generated
# client, licenses and advisories, and that it all builds. The tests run in
# the nightly workflow.

on:
  pull_request:
  push:
    branches: [main, edge]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Every commit is by NetherNode, without trailers
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            .github/scripts/check-identity.sh "$BASE..$HEAD_SHA"
          else
            .github/scripts/check-identity.sh HEAD
          fi
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Protos lint, and the generated client is up to date
        run: |
          pnpm gen
          git diff --exit-code -- src/gen
      - name: No breaking proto changes
        if: github.event_name == 'pull_request'
        run: pnpm exec buf breaking .. --against "../.git#ref=${{ github.event.pull_request.base.sha }}"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm check:bundle
      - name: Dependency advisories
        run: pnpm audit --audit-level high
      - name: Install counter
        working-directory: counter
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc -p .
          pnpm audit --audit-level high

  # Runs alongside the web job: the binary embeds the built panel when it's
  # there (allow_missing), and these checks don't need it.
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo fmt --all --check
      - name: Licenses and advisories
        run: cargo deny check
      # Also compiles the tests, without running them.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

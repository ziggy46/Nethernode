name: Release

# Push a tag like v0.1.0 to build static Linux binaries (x86_64 and
# aarch64), checksums, and a GitHub Release with the changelog. The same tag
# publishes the container image (docker.yml).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  binaries:
    name: Binary (${{ matrix.arch }})
    needs: web
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
    # Arm runners are free for public repositories only; a private one builds
    # arm64 on x86 under emulation, which is much slower.
    runs-on: ${{ matrix.arch == 'arm64' && !github.event.repository.private && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64' && runner.arch == 'X64'
      # Built in Alpine for each architecture, which links statically.
      - name: Build
        run: |
          docker run --rm --platform "linux/${{ matrix.arch }}" -v "$PWD":/src -w /src -e SQLX_OFFLINE=true rust:1.96-alpine \
            sh -c 'apk add --no-cache build-base cmake perl protobuf-dev \
                   && cargo build --release --locked -p nethernode \
                   && chown -R '"$(id -u):$(id -g)"' target'
          mkdir -p out
          cp target/release/nethernode "out/nethernode-${{ matrix.arch }}"
          file "out/nethernode-${{ matrix.arch }}"
          "out/nethernode-${{ matrix.arch }}" --version || true
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: out/nethernode-${{ matrix.arch }}

  release:
    name: GitHub Release
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: out
          merge-multiple: true
      - name: Archives and checksums
        working-directory: out
        run: |
          for arch in amd64 arm64; do
            mv "nethernode-$arch" nethernode && chmod +x nethernode
            tar -czf "nethernode-${GITHUB_REF_NAME}-linux-$arch.tar.gz" nethernode
            rm nethernode
          done
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: |
            out/*.tar.gz
            out/SHA256SUMS

name: Release

# Push a tag like v0.1.0 to build static Linux binaries (x86_64 and
# aarch64), a multi-arch image on GitHub Container Registry, checksums, and
# a GitHub Release with the changelog.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  binaries:
    name: Binary (${{ matrix.arch }})
    needs: web
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      # Built natively on each architecture in Alpine, which links statically.
      - name: Build
        run: |
          docker run --rm -v "$PWD":/src -w /src -e SQLX_OFFLINE=true rust:1.96-alpine \
            sh -c 'apk add --no-cache build-base cmake perl protobuf-dev \
                   && cargo build --release --locked -p nethernode \
                   && chown -R '"$(id -u):$(id -g)"' target'
          mkdir -p out
          cp target/release/nethernode "out/nethernode-${{ matrix.arch }}"
          file "out/nethernode-${{ matrix.arch }}"
          "out/nethernode-${{ matrix.arch }}" --version || true
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: out/nethernode-${{ matrix.arch }}

  image:
    name: Container image
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: out
          merge-multiple: true
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nethernode" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: out
          file: deploy/Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT

  release:
    name: GitHub Release
    needs: [binaries, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: out
          merge-multiple: true
      - name: Archives and checksums
        working-directory: out
        run: |
          for arch in amd64 arm64; do
            mv "nethernode-$arch" nethernode && chmod +x nethernode
            tar -czf "nethernode-${GITHUB_REF_NAME}-linux-$arch.tar.gz" nethernode
            rm nethernode
          done
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: |
            out/*.tar.gz
            out/SHA256SUMS

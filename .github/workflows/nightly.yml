name: Nightly

# Slow checks: the orchestrator starting and stopping real Minecraft server
# containers, and a minute of fuzzing for each parser that reads untrusted
# input.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  docker:
    name: Real Docker integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p nn-orchestrator --locked -- --ignored --test-threads=1

  fuzz:
    name: Fuzz (60 s per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz each target
        run: |
          for t in nn-mcproto:pre_login nn-files:extract_entries nn-files:extract_raw nn-players:nbt nn-link:handshake nn-link:messages nn-node:protocol; do
            echo "::group::${t%%:*} / ${t#*:}"
            (cd "crates/${t%%:*}" && cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "${t#*:}" -- -max_total_time=60)
            echo "::endgroup::"
          done

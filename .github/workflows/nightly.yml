name: Nightly

# The tests (CI only checks that everything builds and lints): unit,
# integration and browser tests, the orchestrator starting and stopping
# real Minecraft server containers (on main and on edge), and a minute of
# fuzzing for each parser that reads untrusted input.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: "Test just this branch (a pull request's, say) instead of main and edge"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  tests:
    name: Tests (${{ matrix.branch }})
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(inputs.branch && format('["{0}"]', inputs.branch) || '["main","edge"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web tests and build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Install counter tests
        working-directory: counter
        run: |
          pnpm install --frozen-lockfile
          pnpm test
      - run: cargo nextest run --workspace --locked
      - run: cargo test --workspace --doc --locked
      # Browser tests against the binary, which embeds the UI built above.
      # No Docker socket: these cover everything that doesn't start a
      # Minecraft server; server lifecycle runs in the docker job.
      - run: cargo build -p nethernode --locked
      - name: Browser tests
        working-directory: web
        env:
          NN_BIN: ../target/debug/nethernode
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.branch }}
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  docker:
    name: Real Docker integration (${{ matrix.branch }})
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(inputs.branch && format('["{0}"]', inputs.branch) || '["main","edge"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p nn-orchestrator --locked -- --ignored --test-threads=1

  fuzz:
    name: Fuzz (60 s per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz each target
        run: |
          for t in nn-mcproto:pre_login nn-files:extract_entries nn-files:extract_raw nn-players:nbt nn-link:handshake nn-link:messages nn-node:protocol; do
            echo "::group::${t%%:*} / ${t#*:}"
            (cd "crates/${t%%:*}" && cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "${t#*:}" -- -max_total_time=60)
            echo "::endgroup::"
          done

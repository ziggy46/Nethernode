name: Publish

# Builds the image from the Dockerfile and publishes it to GitHub Container
# Registry as ghcr.io/<owner>/nethernode, with a GitHub Release holding the
# static binaries (copied out of the image builds):
#   a tag like v0.1.0      -> 0.1.0, 0.1, latest, and a release
#   a push to edge         -> an edge build, 0.1.1-edge.<run>: images
#                             0.1.1-edge.<run>, edge and sha-<commit>, and a
#                             pre-release (its tag is made here)
# On the edge branch, Cargo.toml holds the next release's version, so edge
# builds sort between the last release and the next. Panels on the edge
# update channel follow edge builds. Each architecture builds natively on
# its own runner.

on:
  push:
    branches: [edge]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      edge: ${{ steps.version.outputs.edge }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - uses: actions/checkout@v5
      - name: Work out the version
        id: version
        run: |
          base=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$base" ]; then
              echo "::error::$GITHUB_REF_NAME doesn't match Cargo.toml's version $base"
              exit 1
            fi
            edge=false
          elif [ "$GITHUB_REF_NAME" = edge ]; then
            version="$base-edge.$GITHUB_RUN_NUMBER"
            edge=true
          else
            echo "::error::only the edge branch and v* tags are published"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "edge=$edge" >> "$GITHUB_OUTPUT"
          echo "minor=${base%.*}" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

  build:
    name: Image (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Stamp the edge version
        if: needs.version.outputs.edge == 'true'
        run: python3 .github/scripts/set-version.py "$VERSION"
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nethernode" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Save digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1
      # The same build again, answered from this runner's build cache,
      # written out as files instead of an image.
      - name: Copy out the binary
        run: |
          docker buildx build --platform "linux/${{ matrix.arch }}" --output type=local,dest=image .
          mkdir -p out
          cp image/nethernode "out/nethernode-${{ matrix.arch }}"
          "out/nethernode-${{ matrix.arch }}" --version | grep -qx "nethernode $VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: out/nethernode-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3

  tags:
    name: Image tags
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nethernode" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=edge,enable=${{ needs.version.outputs.edge == 'true' }}
            type=sha,enable=${{ needs.version.outputs.edge == 'true' }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ needs.version.outputs.edge != 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.edge != 'true' }}
      - name: Create the multi-arch tags
        working-directory: digests
        run: |
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${sources[@]}"
        env:
          IMAGE: ${{ steps.name.outputs.image }}
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}

  release:
    name: GitHub Release
    needs: [version, tags]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      EDGE: ${{ needs.version.outputs.edge }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: out
          merge-multiple: true
      - name: Archives and checksums
        working-directory: out
        run: |
          for arch in amd64 arm64; do
            mv "nethernode-$arch" nethernode && chmod +x nethernode
            tar -czf "nethernode-v$VERSION-linux-$arch.tar.gz" nethernode
            rm nethernode
          done
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: orhun/git-cliff-action@v4
        if: env.EDGE != 'true'
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
      - name: Edge build notes
        if: env.EDGE == 'true'
        run: |
          # What's new since the last edge build (or release) before this one.
          previous=$(git tag --merged HEAD --sort=-creatordate --list 'v*' | head -n1)
          {
            echo "An edge build from the \`edge\` branch: new features before they're released."
            echo "Panels on the Edge update channel (Settings › Notifications) offer it."
            echo
            if [ -n "$previous" ]; then
              echo "Since $previous:"
              git log --no-merges --format='- %s' "$previous..HEAD"
            else
              git log --no-merges --format='- %s' -20
            fi
          } > notes.md
          cat notes.md
      - name: Release
        if: env.EDGE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: |
            out/*.tar.gz
            out/SHA256SUMS
      - name: Edge pre-release
        if: env.EDGE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Edge build ${{ env.VERSION }}
          prerelease: true
          body_path: notes.md
          files: |
            out/*.tar.gz
            out/SHA256SUMS
      - name: Keep the ten newest edge builds
        if: env.EDGE == 'true'
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | test("-edge\\."))) | .tagName' |
            sort -t. -k4,4nr | tail -n +11 |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
        env:
          GH_TOKEN: ${{ github.token }}

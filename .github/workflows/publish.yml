name: Publish

# Compiles the static binary on each architecture's own runner (with its
# compiled dependencies cached between runs), packs it into the image
# (.github/docker/Dockerfile.prebuilt, the same image the root Dockerfile
# builds from source) and publishes it to GitHub Container Registry as
# ghcr.io/<owner>/nethernode, with a GitHub Release holding the binaries:
#   a tag like v0.1.0      -> 0.1.0, 0.1, latest, and a release
#   a push to edge, once   -> an edge build, 0.1.1-edge.<run>: images
#   CI passes on it           0.1.1-edge.<run>, edge and sha-<commit>, and a
#                             pre-release (its tag is made here)
# On the edge branch, Cargo.toml holds the next release's version, so edge
# builds sort between the last release and the next (the build is told its
# full version through NETHERNODE_VERSION). Panels on the edge
# update channel follow edge builds. Each architecture builds natively on
# its own runner.

on:
  push:
    tags: ["v*"]
  # Edge builds only from commits CI passed. (This file is read from main.)
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [edge]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The commit being published: the one CI checked, for edge builds.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    # From a workflow run: only a green CI run of a push to this repository's
    # edge branch (never a pull request, whose branch could share the name).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      edge: ${{ steps.version.outputs.edge }}
      minor: ${{ steps.version.outputs.minor }}
      short: ${{ steps.version.outputs.short }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - name: Work out the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          base=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_run ]; then
            GITHUB_REF_TYPE=branch
            GITHUB_REF_NAME="$RUN_BRANCH"
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$base" ]; then
              echo "::error::$GITHUB_REF_NAME doesn't match Cargo.toml's version $base"
              exit 1
            fi
            edge=false
          elif [ "$GITHUB_REF_NAME" = edge ]; then
            version="$base-edge.$GITHUB_RUN_NUMBER"
            edge=true
          else
            echo "::error::only the edge branch and v* tags are published"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "edge=$edge" >> "$GITHUB_OUTPUT"
          echo "minor=${base%.*}" >> "$GITHUB_OUTPUT"
          echo "Publishing $version"

  build:
    name: Image (${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Edge builds skip the slow whole-program optimization; releases get it.
      PROFILE: ${{ needs.version.outputs.edge == 'true' && 'edge' || 'release' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the panel
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # The compiled dependencies, kept between builds of this architecture
      # and profile, so only NetherNode's own crates compile each time.
      - uses: actions/cache@v4
        with:
          path: |
            .build-cache/registry
            .build-cache/target
          key: publish-${{ matrix.arch }}-${{ env.PROFILE }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: publish-${{ matrix.arch }}-${{ env.PROFILE }}-
      # Compiled in the same Alpine (musl) toolchain as the Dockerfile, so the
      # binary is static. NETHERNODE_VERSION names the build without changing
      # Cargo.toml, which would make every crate compile again.
      - name: Compile
        run: |
          mkdir -p .build-cache/registry .build-cache/target image
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v "$PWD/.build-cache/registry:/usr/local/cargo/registry" \
            -e CARGO_TARGET_DIR=/src/.build-cache/target \
            -e SQLX_OFFLINE=true \
            -e NETHERNODE_VERSION="$VERSION" \
            -e PROFILE \
            -e OWNER="$(id -u):$(id -g)" \
            rust:1.96-alpine sh -euc '
              apk add --no-cache build-base cmake perl protobuf-dev ca-certificates >/dev/null
              cargo build --locked -p nethernode --profile "$PROFILE"
              cp ".build-cache/target/$PROFILE/nethernode" image/nethernode
              cp /etc/ssl/certs/ca-certificates.crt image/
              chown -R "$OWNER" .build-cache image
            '
          image/nethernode --version | grep -qx "nethernode $VERSION"
          mkdir -p out
          cp image/nethernode "out/nethernode-${{ matrix.arch }}"
      # They compile again every time anyway; leaving them out keeps the
      # cache from growing with old builds.
      - name: Keep only the dependencies in the cache
        run: |
          cd ".build-cache/target/$PROFILE"
          rm -rf nethernode deps/nethernode-* deps/libnn_* deps/nn_* \
            .fingerprint/nethernode-* .fingerprint/nn-* build/nethernode-* build/nn-*
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nethernode" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          labels: |
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ env.VERSION }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: image
          file: .github/docker/Dockerfile.prebuilt
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
      - name: Save digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: out/nethernode-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3

  tags:
    name: Image tags
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nethernode" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=edge,enable=${{ needs.version.outputs.edge == 'true' }}
            type=raw,value=sha-${{ needs.version.outputs.short }},enable=${{ needs.version.outputs.edge == 'true' }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ needs.version.outputs.edge != 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.edge != 'true' }}
      - name: Create the multi-arch tags
        working-directory: digests
        run: |
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${sources[@]}"
        env:
          IMAGE: ${{ steps.name.outputs.image }}
      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          VERSION: ${{ needs.version.outputs.version }}

  release:
    name: GitHub Release
    needs: [version, tags]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      EDGE: ${{ needs.version.outputs.edge }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: out
          merge-multiple: true
      - name: Archives and checksums
        working-directory: out
        run: |
          for arch in amd64 arm64; do
            mv "nethernode-$arch" nethernode && chmod +x nethernode
            tar -czf "nethernode-v$VERSION-linux-$arch.tar.gz" nethernode
            rm nethernode
          done
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: orhun/git-cliff-action@v4
        if: env.EDGE != 'true'
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header
      - name: Edge build notes
        if: env.EDGE == 'true'
        run: |
          # What's new since the last edge build (or release) before this one.
          previous=$(git tag --merged HEAD --sort=-creatordate --list 'v*' | head -n1)
          {
            echo "An edge build from the \`edge\` branch: new features before they're released."
            echo "Panels on the Edge update channel (Settings › Notifications) offer it."
            echo
            if [ -n "$previous" ]; then
              echo "Since $previous:"
              git log --no-merges --format='- %s' "$previous..HEAD"
            else
              git log --no-merges --format='- %s' -20
            fi
          } > notes.md
          cat notes.md
      - name: Release
        if: env.EDGE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          files: |
            out/*.tar.gz
            out/SHA256SUMS
      - name: Edge pre-release
        if: env.EDGE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ env.SHA }}
          name: Edge build ${{ env.VERSION }}
          prerelease: true
          body_path: notes.md
          files: |
            out/*.tar.gz
            out/SHA256SUMS
      - name: Keep the ten newest edge builds
        if: env.EDGE == 'true'
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | test("-edge\\."))) | .tagName' |
            sort -t. -k4,4nr | tail -n +11 |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
        env:
          GH_TOKEN: ${{ github.token }}

syntax = "proto3";

package nethernode.v1;

// Discord webhook notifications. Administrators and owners.
service NotificationService {
  rpc GetNotifications(GetNotificationsRequest) returns (GetNotificationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Fails with INVALID_ARGUMENT for a URL that isn't a Discord webhook.
  rpc UpdateNotifications(UpdateNotificationsRequest) returns (UpdateNotificationsResponse);

  // Sends a test message. Fails with FAILED_PRECONDITION, saying why, if it
  // doesn't go through.
  rpc SendTestNotification(SendTestNotificationRequest) returns (SendTestNotificationResponse);

  // Whether the panel looks for new NetherNode releases (on by default):
  // about twice a day it asks GitHub for the newest release, and the bell
  // says when there's a newer one.
  rpc SetUpdateCheck(SetUpdateCheckRequest) returns (SetUpdateCheckResponse);

  // Asks GitHub for the newest release now. Fails with UNAVAILABLE, saying
  // why, if GitHub can't be reached.
  rpc CheckForUpdate(CheckForUpdateRequest) returns (CheckForUpdateResponse);

  // Which releases the panel follows: "stable" (releases only, the
  // default) or "edge" (edge builds of new features too). Checks again
  // right away.
  rpc SetUpdateChannel(SetUpdateChannelRequest) returns (SetUpdateChannelResponse);

  // Updates the panel to the newest release: in Docker, a copy of its
  // container on the new image takes over; as a binary, it downloads the
  // release (checked against its checksums) and restarts. The panel goes
  // away for a moment once this answers. Fails with FAILED_PRECONDITION if
  // there's no newer release, or with the reason the update couldn't start.
  rpc UpdatePanel(UpdatePanelRequest) returns (UpdatePanelResponse);
}

message NotificationEvents {
  bool start_stop = 1;
  bool crash = 2;
  bool player_join = 3;
  bool backup_failed = 4;
  // Newer modpack versions, and modpack updates that finish or fail.
  bool modpack_updates = 5;
  // A machine running low on disk, a server stuck lagging, or one with its
  // memory nearly full.
  bool resource_alerts = 6;
}

message GetNotificationsRequest {}

message GetNotificationsResponse {
  // The end of the saved webhook URL, to recognize it by; unset if none.
  optional string webhook_hint = 1;
  NotificationEvents events = 2;
  // Why the last message didn't go through.
  string last_error = 3;
  optional int64 last_sent_ms = 4;
  // Looking for new NetherNode releases is on.
  bool update_check = 5;
  // The newest release found, like "0.2.3", while checking is on.
  string latest_version = 6;
  // This panel's version.
  string current_version = 7;
  // The newest release is newer than this panel, or (on the stable channel)
  // it's the release to go back to from an edge build.
  bool update_available = 8;
  // "stable" or "edge".
  string update_channel = 9;
  // Updating goes back to an older version: from an edge build to the
  // newest stable release.
  bool update_is_switch = 10;
}

message UpdateNotificationsRequest {
  // A new webhook URL; empty removes it; unset keeps the current one.
  optional string webhook_url = 1;
  NotificationEvents events = 2;
}

message UpdateNotificationsResponse {}

message SendTestNotificationRequest {}

message SendTestNotificationResponse {}

message SetUpdateCheckRequest {
  bool enabled = 1;
}

message SetUpdateCheckResponse {}

message CheckForUpdateRequest {}

message CheckForUpdateResponse {
  // The newest release on the panel's channel, like "0.2.4".
  string latest_version = 1;
  // The panel can move to it (see GetNotificationsResponse).
  bool update_available = 2;
  bool update_is_switch = 3;
}

message SetUpdateChannelRequest {
  // "stable" or "edge".
  string channel = 1;
}

message SetUpdateChannelResponse {}

message UpdatePanelRequest {}

message UpdatePanelResponse {
  // The version being installed.
  string version = 1;
}

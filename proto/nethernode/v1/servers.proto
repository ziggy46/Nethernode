syntax = "proto3";

package nethernode.v1;

import "nethernode/v1/catalog.proto";

// Minecraft servers: create, configure, start, stop, and delete them.
// Lifecycle calls return as soon as the operation is underway; watch
// /api/events (`server_status_changed`, `image_pull_progress`,
// `server_operation_failed`) for progress and results.
service ServerService {
  // Lists all servers.
  rpc ListServers(ListServersRequest) returns (ListServersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Gets one server.
  rpc GetServer(GetServerRequest) returns (GetServerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Creates a server. Installation (image download, container creation)
  // continues in the background with status INSTALLING.
  rpc CreateServer(CreateServerRequest) returns (CreateServerResponse);
  // Changes settings. Some changes only apply after a restart.
  rpc UpdateServer(UpdateServerRequest) returns (UpdateServerResponse);
  // Deletes a server, optionally including its world and files.
  rpc DeleteServer(DeleteServerRequest) returns (DeleteServerResponse);
  // Moves a stopped server to another machine, in the background: its
  // folder is archived (the archive stays as a backup on the old machine),
  // set up on the new one, then removed from the old one. Progress and the
  // outcome arrive as file_job events for the returned job.
  rpc MoveServer(MoveServerRequest) returns (MoveServerResponse);

  rpc StartServer(StartServerRequest) returns (StartServerResponse);
  // Saves the world and stops gracefully (up to 60 s, then forced).
  rpc StopServer(StopServerRequest) returns (StopServerResponse);
  rpc RestartServer(RestartServerRequest) returns (RestartServerResponse);
  // Stops immediately without saving.
  rpc KillServer(KillServerRequest) returns (KillServerResponse);

  // Up to an hour of per-second resource samples.
  rpc GetServerStats(GetServerStatsRequest) returns (GetServerStatsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Facts about the Docker host servers run on.
  rpc GetHostInfo(GetHostInfoRequest) returns (GetHostInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The server's server.properties as form fields. Changes apply at the
  // next start.
  rpc GetServerProperties(GetServerPropertiesRequest) returns (GetServerPropertiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Changes values in server.properties, keeping the rest of the file.
  rpc UpdateServerProperties(UpdateServerPropertiesRequest) returns (UpdateServerPropertiesResponse);
}

// A server's lifecycle state.
enum ServerStatus {
  SERVER_STATUS_UNSPECIFIED = 0;
  SERVER_STATUS_INSTALLING = 1;
  SERVER_STATUS_STOPPED = 2;
  SERVER_STATUS_STARTING = 3;
  SERVER_STATUS_RUNNING = 4;
  SERVER_STATUS_STOPPING = 5;
  SERVER_STATUS_SLEEPING = 6;
  SERVER_STATUS_CRASHED = 7;
}

// Card artwork. Presentation only; never affects the world.
enum CardTheme {
  CARD_THEME_UNSPECIFIED = 0;
  CARD_THEME_NETHER = 1;
  CARD_THEME_OVERWORLD = 2;
  CARD_THEME_END = 3;
  CARD_THEME_SKY = 4;
}

// A managed Minecraft server.
message Server {
  string id = 1;
  string name = 2;
  string slug = 3;
  ServerStatus status = 4;
  // e.g. "1.21.4", or "LATEST".
  string mc_version = 5;
  // Server software: vanilla, paper, purpur, fabric, forge, neoforge,
  // quilt, or a modpack: modrinth, curseforge.
  string loader = 6;
  // Port the server listens on at 127.0.0.1, behind the proxy.
  uint32 internal_port = 7;
  // Sleeps when empty and wakes when a player connects.
  bool sleep_when_empty = 8;
  ServerSettings settings = 9;
  // Unix ms.
  int64 created_at_ms = 10;
  // Unix ms; when the server last became RUNNING.
  optional int64 last_started_at_ms = 11;
  // From the last status ping, while running.
  optional uint32 players_online = 12;
  optional uint32 players_max = 13;
  // Exact hostnames routed to this server, for display.
  repeated string hostnames = 14;
  // Settings changed since the container was created; restart to apply.
  bool restart_required = 15;
  // Set when the server is installed from a modpack (loader `modrinth` or
  // `curseforge`).
  optional Modpack modpack = 16;
  // The node it runs on ("local" for the panel's own machine).
  string node_id = 17;
  string node_name = 18;
  // Its node's agent isn't connected, so it can't be managed right now.
  bool node_offline = 19;
  // Its node's agent is connected but runs a different NetherNode version,
  // so it can't be managed until it's updated (node_offline is also set).
  bool node_update_needed = 20;
}

// Settings an admin can change after creation.
message ServerSettings {
  string name = 1;
  string mc_version = 2;
  string loader = 3;
  // Loader or build pin; empty for the default.
  string loader_version = 4;
  // Container image; empty to pick the default for the Java version.
  string image = 5;
  // Java major version override.
  optional uint32 java_version = 6;
  // Java heap in MiB.
  uint32 memory_mb = 7;
  // CPU limit in cores.
  optional double cpu_limit = 8;
  bool auto_start = 9;
  bool sleep_when_empty = 10;
  // Minutes with no players before sleeping (default 10).
  optional uint32 idle_minutes = 11;
  bool restart_on_crash = 12;
  bool use_aikar_flags = 13;
  string motd = 14;
  uint32 max_players = 15;
  CardTheme card_theme = 16;
}

message ListServersRequest {}

message ListServersResponse {
  repeated Server servers = 1;
}

message GetServerRequest {
  string id = 1;
}

message GetServerResponse {
  Server server = 1;
}

message CreateServerRequest {
  string name = 1;
  string loader = 2;
  string mc_version = 3;
  string loader_version = 4;
  uint32 memory_mb = 5;
  CardTheme card_theme = 6;
  // The admin ticked "I accept the Minecraft EULA". Required.
  bool eula_accepted = 7;
  bool sleep_when_empty = 8;
  // Start as soon as installation finishes.
  bool start_after_create = 9;
  // Install this modpack (with loader `modrinth` or `curseforge`). The
  // Minecraft version comes from the pack, except for CurseForge packs
  // without an API key set, where `mc_version` must say which it is.
  ModpackSource modpack = 10;
  // The node to create it on; empty for the panel's own machine.
  string node_id = 11;
}

message CreateServerResponse {
  Server server = 1;
}

message UpdateServerRequest {
  string id = 1;
  ServerSettings settings = 2;
}

message UpdateServerResponse {
  Server server = 1;
}

message DeleteServerRequest {
  string id = 1;
  // Also delete the world, mods, and configuration files.
  bool delete_data = 2;
}

message DeleteServerResponse {}

message MoveServerRequest {
  string id = 1;
  // The machine to move it to.
  string node_id = 2;
}

message MoveServerResponse {
  string job_id = 1;
}

message StartServerRequest {
  string id = 1;
}

message StartServerResponse {}

message StopServerRequest {
  string id = 1;
}

message StopServerResponse {}

message RestartServerRequest {
  string id = 1;
}

message RestartServerResponse {}

message KillServerRequest {
  string id = 1;
}

message KillServerResponse {}

// One resource sample.
message StatSample {
  // Unix ms.
  int64 at_ms = 1;
  // 100 = one full CPU core.
  double cpu_percent = 2;
  uint64 memory_bytes = 3;
  uint64 memory_limit_bytes = 4;
  uint64 net_rx_bytes = 5;
  uint64 net_tx_bytes = 6;
  // Cumulative bytes read from and written to disk.
  uint64 disk_read_bytes = 7;
  uint64 disk_write_bytes = 8;
  // Players online, from the latest status ping.
  optional uint32 players_online = 9;
  // Tick health, when the server reports it: average and 95th-percentile
  // milliseconds per tick, and ticks per second achieved (20 is full speed).
  optional double mspt = 10;
  optional double mspt_p95 = 11;
  optional double tps = 12;
}

message GetServerStatsRequest {
  string id = 1;
}

message GetServerStatsResponse {
  // Oldest first.
  repeated StatSample samples = 1;
  // Space the server's folder and its worlds take, when it can be measured
  // (refreshed every few minutes).
  optional uint64 folder_bytes = 2;
  optional uint64 world_bytes = 3;
  // The most players online at once in the last 24 hours.
  uint32 players_peak_day = 4;
}

message GetHostInfoRequest {}

message GetHostInfoResponse {
  // False when Docker can't be reached; see `error`.
  bool docker_available = 1;
  string error = 2;
  string hostname = 3;
  string operating_system = 4;
  string docker_version = 5;
  uint32 cpus = 6;
  uint64 memory_bytes = 7;
  // The disk holding NetherNode's data folder (servers, backups), when the
  // platform reports it.
  optional uint64 disk_total_bytes = 8;
  optional uint64 disk_free_bytes = 9;
}

message GetServerPropertiesRequest {
  string id = 1;
}

message GetServerPropertiesResponse {
  // False until the server has started once and written the file.
  bool exists = 1;
  // Known keys grouped and in display order, then unknown keys (group
  // "Other"). Only keys present in the file are included.
  repeated ServerProperty properties = 2;
  // File version, for UpdateServerProperties.
  string version = 3;
}

enum PropertyType {
  PROPERTY_TYPE_UNSPECIFIED = 0;
  PROPERTY_TYPE_BOOL = 1;
  PROPERTY_TYPE_INT = 2;
  PROPERTY_TYPE_CHOICE = 3;
  PROPERTY_TYPE_TEXT = 4;
}

message ServerProperty {
  string key = 1;
  // Empty for secrets (see `secret`).
  string value = 2;
  string label = 3;
  string help = 4;
  // General, World, Players, Network, Advanced, or Other.
  string group = 5;
  PropertyType type = 6;
  // For CHOICE.
  repeated string options = 7;
  // For INT.
  optional int64 min = 8;
  optional int64 max = 9;
  // Non-empty when NetherNode controls this key; the field is read-only and
  // this says why or where to change it.
  string managed_reason = 10;
  // The value is hidden.
  bool secret = 11;
}

message UpdateServerPropertiesRequest {
  string id = 1;
  // Keys to change. Managed keys are rejected.
  map<string, string> values = 2;
  // From GetServerProperties; the update fails if the file changed since.
  string version = 3;
}

message UpdateServerPropertiesResponse {
  GetServerPropertiesResponse properties = 1;
}

syntax = "proto3";

package nethernode.v1;

import "nethernode/v1/catalog.proto";

// Minecraft servers: create, configure, start, stop, and delete them.
// Lifecycle calls return as soon as the operation is underway; watch
// /api/events (`server_status_changed`, `image_pull_progress`,
// `server_operation_failed`) for progress and results.
service ServerService {
  // Lists all servers.
  rpc ListServers(ListServersRequest) returns (ListServersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Gets one server.
  rpc GetServer(GetServerRequest) returns (GetServerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Creates a server. Installation (image download, container creation)
  // continues in the background with status INSTALLING.
  rpc CreateServer(CreateServerRequest) returns (CreateServerResponse);
  // Changes settings. Some changes only apply after a restart.
  rpc UpdateServer(UpdateServerRequest) returns (UpdateServerResponse);
  // Deletes a server, optionally including its world and files.
  rpc DeleteServer(DeleteServerRequest) returns (DeleteServerResponse);
  // Moves a stopped server to another machine, in the background: its
  // folder is archived (the archive stays as a backup on the old machine),
  // set up on the new one, then removed from the old one. Progress and the
  // outcome arrive as file_job events for the returned job.
  rpc MoveServer(MoveServerRequest) returns (MoveServerResponse);
  // Copies a server (its files and settings, and its world unless left
  // out) into a new, stopped server on any machine. Schedules, routes and
  // backups stay with the original. Runs in the background; progress and
  // the outcome are reported as file job events under the returned job.
  rpc CopyServer(CopyServerRequest) returns (CopyServerResponse);
  // Saves a server's files and settings, without its world, as a template
  // for new servers. Runs in the background like CopyServer.
  rpc SaveServerTemplate(SaveServerTemplateRequest) returns (SaveServerTemplateResponse);
  rpc ListServerTemplates(ListServerTemplatesRequest) returns (ListServerTemplatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc DeleteServerTemplate(DeleteServerTemplateRequest) returns (DeleteServerTemplateResponse);
  // Creates a new, stopped server from a template, in the background.
  rpc CreateServerFromTemplate(CreateServerFromTemplateRequest) returns (CreateServerFromTemplateResponse);

  rpc StartServer(StartServerRequest) returns (StartServerResponse);
  // Saves the world and stops gracefully (up to 60 s, then forced).
  rpc StopServer(StopServerRequest) returns (StopServerResponse);
  rpc RestartServer(RestartServerRequest) returns (RestartServerResponse);
  // Stops immediately without saving.
  rpc KillServer(KillServerRequest) returns (KillServerResponse);
  // Calls off a restart, stop or update that's still warning players.
  rpc CancelCountdown(CancelCountdownRequest) returns (CancelCountdownResponse);
  // Why the server crashed or wouldn't start, from its newest crash report
  // (or its log): the causes NetherNode recognizes, and which it can fix.
  rpc GetCrashDiagnosis(GetCrashDiagnosisRequest) returns (GetCrashDiagnosisResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Applies the fix for one cause from GetCrashDiagnosis (leaving out the
  // mods at fault, or another Java), then starts the server.
  rpc FixCrash(FixCrashRequest) returns (FixCrashResponse);
  // The world's dimensions, with their sizes and chunk counts.
  rpc GetWorld(GetWorldRequest) returns (GetWorldResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Counts, or trims, the chunks players spent less than a few minutes in,
  // so they generate again when someone gets there. Trimming needs the
  // server stopped, makes a backup first and keeps it from starting until
  // it's done. A background job: the outcome comes as file_job_finished
  // (kind world-trim).
  rpc TrimWorld(TrimWorldRequest) returns (TrimWorldResponse);
  // Pre-generating the world with Chunky: whether it can, whether Chunky is
  // installed, and how a running task is doing.
  rpc GetPregen(GetPregenRequest) returns (GetPregenResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Downloads Chunky for the server's loader from Modrinth (into mods/, or
  // plugins/ on Paper and Purpur). It loads when the server next starts.
  rpc InstallChunky(InstallChunkyRequest) returns (InstallChunkyResponse);
  // Starts pre-generating around the world spawn (the server must run).
  rpc StartPregen(StartPregenRequest) returns (StartPregenResponse);
  // Stops the running pre-generation task.
  rpc CancelPregen(CancelPregenRequest) returns (CancelPregenResponse);

  // Up to an hour of per-second resource samples.
  rpc GetServerStats(GetServerStatsRequest) returns (GetServerStatsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Facts about the Docker host servers run on.
  // Searches the server's saved logs (logs/latest.log and the dated
  // .log.gz files Minecraft keeps), newest first. Moderators and up.
  rpc SearchServerLogs(SearchServerLogsRequest) returns (SearchServerLogsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetHostInfo(GetHostInfoRequest) returns (GetHostInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // The server's server.properties as form fields. Changes apply at the
  // next start.
  rpc GetServerProperties(GetServerPropertiesRequest) returns (GetServerPropertiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Changes values in server.properties, keeping the rest of the file.
  rpc UpdateServerProperties(UpdateServerPropertiesRequest) returns (UpdateServerPropertiesResponse);
}

// A server's lifecycle state.
enum ServerStatus {
  SERVER_STATUS_UNSPECIFIED = 0;
  SERVER_STATUS_INSTALLING = 1;
  SERVER_STATUS_STOPPED = 2;
  SERVER_STATUS_STARTING = 3;
  SERVER_STATUS_RUNNING = 4;
  SERVER_STATUS_STOPPING = 5;
  SERVER_STATUS_SLEEPING = 6;
  SERVER_STATUS_CRASHED = 7;
}

// Card artwork. Presentation only; never affects the world.
enum CardTheme {
  CARD_THEME_UNSPECIFIED = 0;
  CARD_THEME_NETHER = 1;
  CARD_THEME_OVERWORLD = 2;
  CARD_THEME_END = 3;
  CARD_THEME_SKY = 4;
}

// A managed Minecraft server.
message Server {
  string id = 1;
  string name = 2;
  string slug = 3;
  ServerStatus status = 4;
  // e.g. "1.21.4", or "LATEST".
  string mc_version = 5;
  // Server software: vanilla, paper, purpur, fabric, forge, neoforge,
  // quilt, or a modpack: modrinth, curseforge.
  string loader = 6;
  // Port the server listens on at 127.0.0.1, behind the proxy.
  uint32 internal_port = 7;
  // Sleeps when empty and wakes when a player connects.
  bool sleep_when_empty = 8;
  ServerSettings settings = 9;
  // Unix ms.
  int64 created_at_ms = 10;
  // Unix ms; when the server last became RUNNING.
  optional int64 last_started_at_ms = 11;
  // From the last status ping, while running.
  optional uint32 players_online = 12;
  optional uint32 players_max = 13;
  // Exact hostnames routed to this server, for display.
  repeated string hostnames = 14;
  // Settings changed since the container was created; restart to apply.
  bool restart_required = 15;
  // Set when the server is installed from a modpack (loader `modrinth` or
  // `curseforge`).
  optional Modpack modpack = 16;
  // The node it runs on ("local" for the panel's own machine).
  string node_id = 17;
  string node_name = 18;
  // Its node's agent isn't connected, so it can't be managed right now.
  bool node_offline = 19;
  // Its node's agent is connected but runs a different NetherNode version,
  // so it can't be managed until it's updated (node_offline is also set).
  bool node_update_needed = 20;
  // Running, but paused by Minecraft itself because nobody's online
  // (`pause-when-empty-seconds`, 1.21.2 and later). It resumes when a
  // player joins.
  bool paused = 21;
  // A countdown warning players before a restart, stop or update
  // ("restart", "stop", "update"), or empty.
  string countdown = 22;
  // When that countdown ends (unix ms).
  int64 countdown_at_ms = 23;
}

// Settings an admin can change after creation.
message ServerSettings {
  string name = 1;
  string mc_version = 2;
  string loader = 3;
  // Loader or build pin; empty for the default.
  string loader_version = 4;
  // Container image. Empty: the default for the Java version. When
  // updating, leave it unset to keep the current one.
  optional string image = 5;
  // Java major version override.
  optional uint32 java_version = 6;
  // Java heap in MiB.
  uint32 memory_mb = 7;
  // CPU limit in cores. When updating, leave it unset to keep the current
  // one; 0 removes it.
  optional double cpu_limit = 8;
  bool auto_start = 9;
  bool sleep_when_empty = 10;
  // Minutes with no players before sleeping (default 10).
  optional uint32 idle_minutes = 11;
  bool restart_on_crash = 12;
  bool use_aikar_flags = 13;
  string motd = 14;
  uint32 max_players = 15;
  CardTheme card_theme = 16;
}

message ListServersRequest {}

message ListServersResponse {
  repeated Server servers = 1;
}

message GetServerRequest {
  string id = 1;
}

message GetServerResponse {
  Server server = 1;
}

message CreateServerRequest {
  string name = 1;
  string loader = 2;
  string mc_version = 3;
  string loader_version = 4;
  uint32 memory_mb = 5;
  CardTheme card_theme = 6;
  // The admin ticked "I accept the Minecraft EULA". Required.
  bool eula_accepted = 7;
  bool sleep_when_empty = 8;
  // Start as soon as installation finishes.
  bool start_after_create = 9;
  // Install this modpack (with loader `modrinth` or `curseforge`). The
  // Minecraft version comes from the pack, except for CurseForge packs
  // without an API key set, where `mc_version` must say which it is.
  ModpackSource modpack = 10;
  // The node to create it on; empty for the panel's own machine.
  string node_id = 11;
}

message CreateServerResponse {
  Server server = 1;
}

message UpdateServerRequest {
  string id = 1;
  ServerSettings settings = 2;
  // When the Minecraft version or software changes, back the server up first
  // (labelled with the old version) and change nothing if that fails.
  bool backup_first = 3;
}

message UpdateServerResponse {
  Server server = 1;
}

message DeleteServerRequest {
  string id = 1;
  // Also delete the world, mods, and configuration files.
  bool delete_data = 2;
}

message DeleteServerResponse {}

message MoveServerRequest {
  string id = 1;
  // The machine to move it to.
  string node_id = 2;
}

message MoveServerResponse {
  string job_id = 1;
}

message StartServerRequest {
  string id = 1;
}

message StartServerResponse {}

message StopServerRequest {
  string id = 1;
  // Warn the players in chat for this many minutes (1–30) before stopping;
  // 0 stops now.
  uint32 warn_minutes = 2;
}

message StopServerResponse {}

message RestartServerRequest {
  string id = 1;
  // Warn the players in chat for this many minutes (1–30) before
  // restarting; 0 restarts now.
  uint32 warn_minutes = 2;
}

message RestartServerResponse {}

message GetWorldRequest {
  string id = 1;
}

message WorldDimension {
  // minecraft:overworld, minecraft:the_nether, minecraft:the_end, or a
  // mod's (namespace:name).
  string id = 1;
  // Its folder.
  string path = 2;
  // Bytes in its region, entity and POI files.
  uint64 bytes = 3;
  // Chunks saved.
  uint64 chunks = 4;
}

message GetWorldResponse {
  // The world folder (level-name).
  string level = 1;
  repeated WorldDimension dimensions = 2;
}

message TrimWorldRequest {
  string id = 1;
  // Chunks players spent less than this many minutes in go (1–600).
  uint32 minutes = 2;
  // Chunks within this many chunks of the spawn (and the End's centre)
  // stay.
  uint32 keep_radius = 3;
  // Trim; otherwise only count.
  bool apply = 4;
}

message TrimWorldResponse {
  string job_id = 1;
}

message GetPregenRequest {
  string id = 1;
}

message GetPregenResponse {
  // Why the server can't pre-generate (vanilla), or empty.
  string unavailable = 1;
  // Chunky is in mods/ or plugins/.
  bool installed = 2;
  // The server is running (Chunky only works then).
  bool server_running = 3;
  // Chunky has loaded (it answered).
  bool loaded = 4;
  // A task is running.
  bool running = 5;
  double percent = 6;
  uint64 chunks = 7;
  // Time left, "h:mm:ss".
  string eta = 8;
  // Chunky's own words.
  string message = 9;
}

message InstallChunkyRequest {
  string id = 1;
}

message InstallChunkyResponse {
  string message = 1;
}

message StartPregenRequest {
  string id = 1;
  // Blocks from the spawn.
  uint32 radius = 2;
  // Answer yes to what Chunky asked (it asks before redoing a task, or
  // when disk space looks short).
  bool confirm = 3;
}

message StartPregenResponse {
  // Chunky's reply.
  string message = 1;
}

message CancelPregenRequest {
  string id = 1;
}

message CancelPregenResponse {
  string message = 1;
}

message GetCrashDiagnosisRequest {
  string id = 1;
}

// A mod a crash points at.
message CrashMod {
  string mod_id = 1;
  // From the jar, when it's found.
  string name = 2;
  // Its file in mods/, when it's found.
  string file = 3;
  // What it needs, for mods that don't fit (a dependency or version).
  string detail = 4;
}

message CrashCause {
  // client_only, missing_dependencies, incompatible, mixin_failed,
  // needs_java, or out_of_memory.
  string kind = 1;
  // What happened, in a sentence or two.
  string summary = 2;
  repeated CrashMod mods = 3;
  // needs_java: the Java version.
  uint32 java = 4;
  // What FixCrash would do for it; empty when there's nothing to click.
  string fix = 5;
}

message GetCrashDiagnosisResponse {
  repeated CrashCause causes = 1;
  // The file it was read from (crash-reports/… or logs/latest.log), or
  // empty when there was nothing to read.
  string source = 2;
}

message FixCrashRequest {
  string id = 1;
  // The cause's kind.
  string kind = 2;
}

message FixCrashResponse {
  // What was done.
  string message = 1;
}

message CancelCountdownRequest {
  string id = 1;
}

message CancelCountdownResponse {}

message KillServerRequest {
  string id = 1;
}

message KillServerResponse {}

// One resource sample.
message StatSample {
  // Unix ms.
  int64 at_ms = 1;
  // 100 = one full CPU core.
  double cpu_percent = 2;
  uint64 memory_bytes = 3;
  uint64 memory_limit_bytes = 4;
  uint64 net_rx_bytes = 5;
  uint64 net_tx_bytes = 6;
  // Cumulative bytes read from and written to disk.
  uint64 disk_read_bytes = 7;
  uint64 disk_write_bytes = 8;
  // Players online, from the latest status ping.
  optional uint32 players_online = 9;
  // Tick health, when the server reports it: average and 95th-percentile
  // milliseconds per tick, and ticks per second achieved (20 is full speed).
  optional double mspt = 10;
  optional double mspt_p95 = 11;
  optional double tps = 12;
}

// How far back GetServerStats looks.
enum StatsRange {
  // The last hour, one sample a second (`samples`).
  STATS_RANGE_UNSPECIFIED = 0;
  // The last 24 hours in 5-minute periods (`periods`).
  STATS_RANGE_DAY = 1;
  // The last 7 days in 1-hour periods.
  STATS_RANGE_WEEK = 2;
  // The last 30 days in 4-hour periods.
  STATS_RANGE_MONTH = 3;
}

// A summary of a server's samples over one period. Periods with no samples
// (the server wasn't running) are left out.
message StatPeriod {
  // Start, unix ms.
  int64 at_ms = 1;
  // Length in seconds.
  uint32 seconds = 2;
  // About how many seconds of it the server was running.
  uint32 running_seconds = 3;
  double cpu_avg = 4;
  double cpu_max = 5;
  uint64 memory_avg = 6;
  uint64 memory_max = 7;
  uint64 memory_limit = 8;
  // Bytes moved during the period.
  uint64 net_rx = 9;
  uint64 net_tx = 10;
  uint64 disk_read = 11;
  uint64 disk_write = 12;
  optional uint32 players_max = 13;
  // Tick health, when the server reported it.
  optional double mspt_avg = 14;
  optional double mspt_max = 15;
  optional double tps_avg = 16;
  optional double tps_min = 17;
  // About how many seconds the server was paused for want of players.
  uint32 paused_seconds = 18;
}

message GetServerStatsRequest {
  string id = 1;
  StatsRange range = 2;
}

message GetServerStatsResponse {
  // Oldest first.
  repeated StatSample samples = 1;
  // Space the server's folder and its worlds take, when it can be measured
  // (refreshed every few minutes).
  optional uint64 folder_bytes = 2;
  optional uint64 world_bytes = 3;
  // The most players online at once in the last 24 hours.
  uint32 players_peak_day = 4;
  // For the longer ranges, oldest first.
  repeated StatPeriod periods = 5;
  // Where the longer ranges start, unix ms.
  int64 since_ms = 6;
}

message SearchServerLogsRequest {
  string id = 1;
  // Matched in any case. May be empty with `chat_only`, for all chat.
  string query = 2;
  // Only players' chat messages.
  bool chat_only = 3;
}

// A matching log line.
message LogMatch {
  // The file in logs/: "latest.log" (the current or last run) or a dated
  // one like "2026-10-15-1.log.gz".
  string file = 1;
  int64 file_modified_ms = 2;
  // 1-based line number in the file.
  uint32 line = 3;
  // The line, without color codes.
  string text = 4;
}

message SearchServerLogsResponse {
  // Newest files first; lines in order within a file. At most 300, the
  // newest ones.
  repeated LogMatch matches = 1;
  uint32 files_searched = 2;
  uint32 files_total = 3;
  // The search stopped early (too many matches or files, or it took too
  // long), so older matches may be missing.
  bool truncated = 4;
}

message CopyServerRequest {
  string id = 1;
  // The copy's name.
  string name = 2;
  // The machine to put it on; empty for the panel's own.
  string node_id = 3;
  // Copy the world too; otherwise the copy makes a new one when it starts.
  bool include_world = 4;
}

message CopyServerResponse {
  string job_id = 1;
}

message SaveServerTemplateRequest {
  string id = 1;
  // The template's name.
  string name = 2;
}

message SaveServerTemplateResponse {
  string job_id = 1;
}

// A server's files (without its world) and settings, to start new servers
// from.
message ServerTemplate {
  string id = 1;
  string name = 2;
  // The server it was saved from (it may be gone since).
  string source_name = 3;
  string loader = 4;
  string mc_version = 5;
  uint32 memory_mb = 6;
  uint64 size_bytes = 7;
  int64 created_at_ms = 8;
}

message ListServerTemplatesRequest {}

message ListServerTemplatesResponse {
  // Newest first.
  repeated ServerTemplate templates = 1;
}

message DeleteServerTemplateRequest {
  string id = 1;
}

message DeleteServerTemplateResponse {}

message CreateServerFromTemplateRequest {
  string template_id = 1;
  // The new server's name.
  string name = 2;
  // The machine to create it on; empty for the panel's own.
  string node_id = 3;
}

message CreateServerFromTemplateResponse {
  string job_id = 1;
}

message GetHostInfoRequest {}

message GetHostInfoResponse {
  // False when Docker can't be reached; see `error`.
  bool docker_available = 1;
  string error = 2;
  string hostname = 3;
  string operating_system = 4;
  string docker_version = 5;
  uint32 cpus = 6;
  uint64 memory_bytes = 7;
  // The disk holding NetherNode's data folder (servers, backups), when the
  // platform reports it.
  optional uint64 disk_total_bytes = 8;
  optional uint64 disk_free_bytes = 9;
}

message GetServerPropertiesRequest {
  string id = 1;
}

message GetServerPropertiesResponse {
  // False until the server has started once and written the file.
  bool exists = 1;
  // Known keys grouped and in display order, then unknown keys (group
  // "Other"). Only keys present in the file are included.
  repeated ServerProperty properties = 2;
  // File version, for UpdateServerProperties.
  string version = 3;
}

enum PropertyType {
  PROPERTY_TYPE_UNSPECIFIED = 0;
  PROPERTY_TYPE_BOOL = 1;
  PROPERTY_TYPE_INT = 2;
  PROPERTY_TYPE_CHOICE = 3;
  PROPERTY_TYPE_TEXT = 4;
}

message ServerProperty {
  string key = 1;
  // Empty for secrets (see `secret`).
  string value = 2;
  string label = 3;
  string help = 4;
  // General, World, Players, Network, Advanced, or Other.
  string group = 5;
  PropertyType type = 6;
  // For CHOICE.
  repeated string options = 7;
  // For INT.
  optional int64 min = 8;
  optional int64 max = 9;
  // Non-empty when NetherNode controls this key; the field is read-only and
  // this says why or where to change it.
  string managed_reason = 10;
  // The value is hidden.
  bool secret = 11;
}

message UpdateServerPropertiesRequest {
  string id = 1;
  // Keys to change. Managed keys are rejected.
  map<string, string> values = 2;
  // From GetServerProperties; the update fails if the file changed since.
  string version = 3;
}

message UpdateServerPropertiesResponse {
  GetServerPropertiesResponse properties = 1;
}
